<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />

    <!-- Primary Meta Tags -->
    <title>Polaris AI - Dominate AI Search & Discovery</title>
    <meta name="title" content="Polaris AI - Dominate AI Search & Discovery" />
    <meta
      name="description"
      content="Enterprise AI optimization platform helping businesses rank in ChatGPT, Claude, Perplexity, and generative AI search. Automated diagnostics, metadata generation, and brand visibility intelligence for the future of search."
    />
    <meta
      name="keywords"
      content="AEO, answer engine optimization, AI search, ChatGPT SEO, generative engine optimization, AI visibility, brand discovery, enterprise AI, AI compliance"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1778692099263" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon.png?v=1778692099263"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon.png?v=1778692099263"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=1778692099263"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/favicon.png?v=1778692099263"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://polaris-ai.com/" />
    <meta
      property="og:title"
      content="Polaris AI - Dominate AI Search & Answer Engine Optimization"
    />
    <meta
      property="og:description"
      content="Enterprise platform for AI search optimization. Rank in ChatGPT, Claude, and Perplexity with automated diagnostics and brand visibility intelligence."
    />
    <meta property="og:site_name" content="Polaris AI" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://polaris-ai.com/" />
    <meta
      property="twitter:title"
      content="Polaris AI - Dominate AI Search & Answer Engine Optimization"
    />
    <meta
      property="twitter:description"
      content="Enterprise platform for AI search optimization. Rank in ChatGPT, Claude, and Perplexity with automated diagnostics and brand visibility intelligence."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Polaris AI",
        "description": "Enterprise AI optimization platform for answer engine optimization and brand visibility",
        "url": "https://polaris-ai.com",
        "logo": "https://polaris-ai.com/logo.png",
        "sameAs": ["https://linkedin.com/company/polaris-ai"]
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Polaris AI",
        "url": "https://polaris-ai.com",
        "description": "Enterprise AI optimization platform helping businesses dominate AI-powered search",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://polaris-ai.com/app?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
